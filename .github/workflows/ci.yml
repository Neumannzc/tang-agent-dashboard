name: CI

on:
  push:
    branches: [master]
  pull_request: {}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:e2e:daemon
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm run test:e2e:desktop
      - if: failure()
        run: find . -name "*.log" -type f -exec sed -i -E 's/[0-9a-f]{64}/[REDACTED]/g' {} +
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-logs
          path: |
            **/*.log
            **/screenshots/**
          if-no-files-found: ignore
